version: '3.8'

services:
  autoBN:
    build:
      context: ./  # Dockerfile 所在目录
      dockerfile: Dockerfile  # 可省略，如果就是默认名字

    image: autobn:latest
    container_name: autoBN
    restart: always
    volumes:
      - ./:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - shared-network
    environment:
      - TZ=Asia/Shanghai  # 设置为上海时区，可根据需求修改
      - APP_NAME=${APP_NAME}
      - APP_VERSION=${APP_VERSION}
      - API_KEY=${API_KEY}
      - API_SECRET=${API_SECRET}
      - WX_KEY=${WX_KEY}
      - USER_NAME=${USER_NAME}
    # 添加定时同步时间的命令，每30秒同步一次
    command: |
      sh -c "
      while true; do
        date -s \"$$(date -u +'%Y-%m-%d %H:%M:%S')\"
        sleep 30
      done &
      exec python /app/autoBN.py
      "

networks:
  shared-network:
    driver: bridge
#    external: true
#    name: deploy_wechatpadpro-network  # 关键：使用项目A创建的网络全名

