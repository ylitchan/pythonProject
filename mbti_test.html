<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI 性格测试 - 发现真实的自己</title>
    <meta name="description" content="专业的MBTI性格测试，帮助你深入了解自己的性格类型">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary-color: #ec4899;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .start-section {
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        .start-section h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .start-section p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .question-section {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--bg-card);
            border-radius: 10px;
            margin-bottom: 2rem;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 10px;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .question-header {
            margin-bottom: 2rem;
        }

        .question-number {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .option {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .option:hover {
            background: var(--bg-card-hover);
            border-color: var(--primary-light);
            transform: translateX(4px);
        }

        .option:hover::before {
            transform: scaleY(1);
        }

        .option.selected {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.2));
            border-color: var(--primary-color);
        }

        .option.selected::before {
            transform: scaleY(1);
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .option-radio {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .option.selected .option-radio {
            border-color: var(--primary-color);
            background: var(--primary-color);
        }

        .option.selected .option-radio::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        .option-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            flex: 1;
        }

        .option.selected .option-text {
            color: var(--text-primary);
            font-weight: 500;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--primary-light);
        }

        .result-section {
            display: none;
            animation: fadeIn 0.8s ease-out;
        }

        .result-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .result-type {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            letter-spacing: 0.05em;
        }

        .result-title {
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .result-subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .result-content h3 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
            margin-top: 2rem;
        }

        .result-content p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 1rem;
        }

        .result-content ul {
            list-style: none;
            margin-bottom: 1.5rem;
        }

        .result-content li {
            font-size: 1.05rem;
            color: var(--text-secondary);
            padding: 0.5rem 0;
            padding-left: 1.5rem;
            position: relative;
        }

        .result-content li::before {
            content: '✦';
            position: absolute;
            left: 0;
            color: var(--primary-color);
        }

        .dimensions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .dimension {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
            transition: all 0.3s ease;
        }

        .dimension:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .dimension-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .dimension-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .card {
                padding: 1.5rem;
            }

            .question-text {
                font-size: 1.2rem;
            }

            .result-type {
                font-size: 3rem;
            }

            .dimensions {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>MBTI 性格测试</h1>
            <p class="subtitle">探索你的性格类型，发现真实的自己</p>
        </header>

        <!-- 开始页面 -->
        <div id="startSection" class="card start-section">
            <h2>欢迎参加 MBTI 性格测试</h2>
            <p>
                MBTI（Myers-Briggs Type Indicator）是一种广泛使用的性格分类工具，
                它将人的性格分为16种类型。通过回答一系列问题，你将了解自己在四个维度上的偏好：
            </p>
            <div class="dimensions">
                <div class="dimension">
                    <div class="dimension-label">能量来源</div>
                    <div class="dimension-value">E / I</div>
                </div>
                <div class="dimension">
                    <div class="dimension-label">信息获取</div>
                    <div class="dimension-value">S / N</div>
                </div>
                <div class="dimension">
                    <div class="dimension-label">决策方式</div>
                    <div class="dimension-value">T / F</div>
                </div>
                <div class="dimension">
                    <div class="dimension-label">生活态度</div>
                    <div class="dimension-value">J / P</div>
                </div>
            </div>
            <p>
                本测试共有 <strong>20 道题</strong>，请根据你的真实感受选择最符合你的选项。
                没有对错之分，请诚实作答以获得最准确的结果。
            </p>
            <button class="btn btn-primary" onclick="startTest()">开始测试</button>
        </div>

        <!-- 问题页面 -->
        <div id="questionSection" class="card question-section">
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill" style="width: 0%"></div>
            </div>
            
            <div class="question-header">
                <div class="question-number" id="questionNumber">问题 1 / 20</div>
                <div class="question-text" id="questionText"></div>
            </div>

            <div class="options" id="optionsContainer"></div>

            <div class="navigation">
                <button class="btn btn-secondary" onclick="previousQuestion()" id="prevBtn">上一题</button>
                <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn">下一题</button>
            </div>
        </div>

        <!-- 结果页面 -->
        <div id="resultSection" class="card result-section">
            <div class="result-header">
                <div class="result-type" id="resultType"></div>
                <div class="result-title" id="resultTitle"></div>
                <div class="result-subtitle" id="resultSubtitle"></div>
            </div>

            <div class="dimensions" id="resultDimensions"></div>

            <div class="result-content" id="resultContent"></div>

            <div style="text-align: center; margin-top: 3rem;">
                <button class="btn btn-primary" onclick="restartTest()">重新测试</button>
            </div>
        </div>
    </div>

    <script>
        // MBTI 测试题目
        const questions = [
            // E vs I (外向 vs 内向)
            {
                text: "在社交聚会中，你通常：",
                dimension: "EI",
                options: [
                    { text: "主动与很多人交谈，感到精力充沛", value: "E" },
                    { text: "更喜欢与少数几个人深入交谈", value: "I" }
                ]
            },
            {
                text: "当你感到疲惫时，你更倾向于：",
                dimension: "EI",
                options: [
                    { text: "与朋友出去放松，通过社交恢复精力", value: "E" },
                    { text: "独自待着，通过安静的活动恢复精力", value: "I" }
                ]
            },
            {
                text: "在团队项目中，你更喜欢：",
                dimension: "EI",
                options: [
                    { text: "通过讨论和头脑风暴来产生想法", value: "E" },
                    { text: "先独立思考，再分享自己的想法", value: "I" }
                ]
            },
            {
                text: "关于你的朋友圈，你认为：",
                dimension: "EI",
                options: [
                    { text: "我有很多朋友和熟人", value: "E" },
                    { text: "我有少数几个非常亲密的朋友", value: "I" }
                ]
            },
            {
                text: "在陌生环境中，你通常：",
                dimension: "EI",
                options: [
                    { text: "很快就能适应并主动认识新朋友", value: "E" },
                    { text: "需要时间观察和适应环境", value: "I" }
                ]
            },

            // S vs N (实感 vs 直觉)
            {
                text: "在学习新事物时，你更喜欢：",
                dimension: "SN",
                options: [
                    { text: "关注具体的事实和细节", value: "S" },
                    { text: "理解整体概念和可能性", value: "N" }
                ]
            },
            {
                text: "当别人向你描述事情时，你更注意：",
                dimension: "SN",
                options: [
                    { text: "实际发生了什么，具体的细节", value: "S" },
                    { text: "事情背后的含义和可能的影响", value: "N" }
                ]
            },
            {
                text: "你更倾向于相信：",
                dimension: "SN",

                    { text: "实际经验和已被证实的方法", value: "S" },
                    { text: "直觉和未来的可能性", value: "N" }

            },
            {
                text: "在解决问题时，你更喜欢：",

                options: [
                    { text: "使用已知的、实用的解决方案", value: "S" },
                    { text: "探索新的、创新的方法", value: "N" }
                ]
            },
            {
                text: "你更喜欢的工作是：",
                dimension: "SN",
                options: [
                    { text: "有明确步骤和实际应用的工作", value: "S" },
                    { text: "需要想象力和创造性思维的工作", value: "N" }
                ]
            },

            // T vs F (思考 vs 情感)
            {
                text: "在做决定时，你更看重：",
                dimension: "TF",
                options: [
                    { text: "逻辑分析和客观标准", value: "T" },
                    { text: "对他人的影响和人际和谐", value: "F" }
                ]
            },
            {
                text: "当朋友遇到问题时，你更倾向于：",
                dimension: "TF",
                options: [
                    { text: "帮助分析问题并提供解决方案", value: "T" },
                    { text: "倾听和提供情感支持", value: "F" }
                ]
            },
            {
                text: "你认为更重要的是：",
                dimension: "TF",
                options: [
                    { text: "公平和正义", value: "T" },
                    { text: "同情和理解", value: "F" }
                ]
            },
            {
                text: "在评价一个想法时，你首先考虑：",
                dimension: "TF",
                options: [
                    { text: "这个想法是否合理和有效", value: "T" },
                    { text: "这个想法对人们的影响", value: "F" }
                ]
            },
            {
                text: "别人可能会说你：",
                dimension: "TF",
                options: [
                    { text: "理性、客观、善于分析", value: "T" },
                    { text: "善解人意、富有同情心", value: "F" }
                ]
            },

            // J vs P (判断 vs 知觉)
            {
                text: "对于日常生活，你更喜欢：",
                dimension: "JP",
                options: [
                    { text: "有计划和组织，按部就班", value: "J" },
                    { text: "保持灵活，随机应变", value: "P" }

            },
            {
                text: "在完成任务时，你倾向于：",
                dimension: "JP",
                options: [
                    { text: "尽早开始，按计划完成", value: "J" },
                    { text: "在截止日期前完成，享受压力", value: "P" }
                ]
            },
            {
                text: "你的工作空间通常是：",
                dimension: "JP",
                options: [
                    { text: "整洁有序，物品摆放有规律", value: "J" },
                    { text: "相对混乱，但你知道东西在哪", value: "P" }
                ]
            },
            {
                text: "对于周末计划，你更喜欢：",
                dimension: "JP",
                options: [
                    { text: "提前安排好活动", value: "J" },
                    { text: "看当时的心情和情况决定", value: "P" }

            },
            {
                text: "在项目进行中，你更倾向于：",
                dimension: "JP",
                options: [
                    { text: "尽快做出决定并执行", value: "J" },
                    { text: "保持开放，收集更多信息", value: "P" }
                ]
            }
        ];

        // MBTI 类型描述
        const mbtiTypes = {

                    <h3>挑战</h3>
                    <ul>
                        <li>可能过于自信，不易接受批评</li>
                        <li>有时显得冷漠，缺乏情感表达</li>

                    </ul>
                    
                    <h3>适合的职业</h3>
                    <p>科学家、工程师、战略规划师、系统分析师、建筑师、教授、研究员</p>
                `
            },
            "INTP": {
                title: "逻辑学家",
                subtitle: "创新的发明家，对知识有着不可遏制的渴望",
                description: `
                    <h3>性格特点</h3>
                    <p>INTP 是富有创造力的思想家，对理论和抽象概念充满热情。他们追求理解世界的运作原理，喜欢探索新想法。</p>
                    
                    <h3>优势</h3>
                    <ul>
                        <li>分析能力强，善于发现模式和联系</li>
                        <li>创新思维，能提出独特的解决方案</li>
                        <li>客观公正，不受情感影响</li>

                        <li>灵活适应，能够快速调整思路</li>
                    </ul>
                    
                    <h3>挑战</h3>
                    <ul>

                (answers.EI > 0 ? 'E' : 'I') +
                (answers.SN > 0 ? 'S' : 'N') +
                (answers.TF > 0 ? 'T' : 'F') +
                (answers.JP > 0 ? 'J' : 'P');
            
            showResult(type);
        }

        // 显示结果
        function showResult(type) {
            const typeInfo = mbtiTypes[type];
            
            document.getElementById('questionSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            
            document.getElementById('resultType').textContent = type;
            document.getElementById('resultTitle').textContent = typeInfo.title;
            document.getElementById('resultSubtitle').textContent = typeInfo.subtitle;
            
            // 显示各维度倾向
            const dimensionsHtml = `
                <div class="dimension">
                    <div class="dimension-label">${answers.EI > 0 ? '外向 (E)' : '内向 (I)'}</div>
                    <div class="dimension-value">${Math.abs(answers.EI)}</div>
                </div>
                <div class="dimension">
                    <div class="dimension-label">${answers.SN > 0 ? '实感 (S)' : '直觉 (N)'}</div>
                    <div class="dimension-value">${Math.abs(answers.SN)}</div>
                </div>
                <div class="dimension">
                    <div class="dimension-label">${answers.TF > 0 ? '思考 (T)' : '情感 (F)'}</div>
                    <div class="dimension-value">${Math.abs(answers.TF)}</div>
                </div>
                <div class="dimension">
                    <div class="dimension-label">${answers.JP > 0 ? '判断 (J)' : '知觉 (P)'}</div>
                    <div class="dimension-value">${Math.abs(answers.JP)}</div>
                </div>
            `;
            document.getElementById('resultDimensions').innerHTML = dimensionsHtml;
            
            document.getElementById('resultContent').innerHTML = typeInfo.description;
        }

        // 重新测试
        function restartTest() {
            currentQuestion = 0;
            answers = { EI: 0, SN: 0, TF: 0, JP: 0 };
            selectedAnswers = new Array(questions.length).fill(null);
            
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('startSection').style.display = 'block';
        }
    </script>
</body>
</html>
