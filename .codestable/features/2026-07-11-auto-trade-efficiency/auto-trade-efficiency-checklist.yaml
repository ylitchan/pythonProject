feature: 2026-07-11-auto-trade-efficiency
created: 2026-07-11

steps:
  - action: "行为安全网：固化 Excel、AUTOA 收盘、AUTOBN API 与 Session 当前契约"
    exit_signal: "目标路径在不修改生产逻辑时均有可运行的 characterization tests"
    status: done
  - action: "平仓持久化：使用单写者批次减少 Excel 全量读写"
    exit_signal: "同批多笔记录一次落盘且路径、sheet、列、格式、顺序不变，失败记录可重试"
    status: done
  - action: "AUTOA 收盘编排：涨停池按既有并发上限受控并发"
    exit_signal: "并发不超上限，结果与串行语义一致，单只失败不影响其他股票"
    status: done
  - action: "AUTOBN 数据复用：exchangeInfo 长 TTL 与 position risk 刷新周期快照"
    exit_signal: "元数据调用次数下降，仓位保持15分钟刷新且交易后确认仍远端查询"
    status: done
  - action: "多空比新鲜度：仅合并距离当前不超过 5 分钟的 5m 记录"
    exit_signal: "恰好 5 分钟可用，超过 5 分钟不可用且不以过期缓存兜底"
    status: done
  - action: "Session 生命周期：AUTOA 与 AUTOBN 各自共享并统一幂等关闭"
    exit_signal: "重复消息复用连接，退出后均关闭，关闭后可重新初始化"
    status: done
  - action: "整体回归：验证性能边界和交易时效范围守护"
    exit_signal: "目标测试与既有测试全部通过，明确不做项无代码偏离"
    status: done

