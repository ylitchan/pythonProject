steps:
  - action: "依赖与配置骨架：安装 PushPlus SDK 和 dotenv 加载依赖，建立安全的环境变量契约"
    exit_signal: "依赖可导入，项目根目录 .env 可加载，.env 被忽略且 .env.example 不含真实值"
