  - action: "PushPlus SDK 适配：以 SDK Markdown 发送替换自写 HTTP"
    exit_signal: "mock SDK 验证凭证、标题、正文、Markdown 模板和异步线程发送"
    status: done
  - action: "回归与真实通道验证：运行测试并通过本地 .env 发送真实 SDK 消息"
    exit_signal: "测试通过、真实 SDK 返回成功且输出和提交中无秘密"
    status: done
  - action: "验收闭环：核对契约、更新 CodeStable 状态并 scoped commit"
    exit_signal: "acceptance 完整、检查项通过、提交仅含本 feature 相关文件且未 push"
    status: done

