feature: 2026-07-14-pushplus-trade-notifications
created: 2026-07-14

steps:
  - action: "微重构：建立独立 PushPlus 交易通知模块并保持原交易行为"
    exit_signal: "交易文件只保留业务筛选和调用，通知模块可独立导入且原测试通过"
    status: done
  - action: "格式节点：生成成功与失败交易的 Markdown 标题和正文"
    exit_signal: "输出包含状态、市场、动作、标的、策略及有序交易字段且无 HTML"
    status: done
  - action: "发送节点：接通环境 token、成功响应和失败隔离"
    exit_signal: "token 缺失静默跳过，HTTP或业务失败只记录错误且不抛向交易流程"
    status: done
  - action: "AUTOBN 接入：覆盖成功开平仓和交易动作失败"
    exit_signal: "目标交易事件各最多推送一次，一般系统异常不进入 PushPlus"
    status: done
  - action: "AUTOA 接入：只覆盖含 N 策略的成功开平仓"
    exit_signal: "含N调用PushPlus，非N不调用，企业微信行为不变"
    status: done
  - action: "端到端验证：运行回归测试并发送真实 Markdown 测试消息"
    exit_signal: "自动化测试通过且 PushPlus 返回业务 code 200"
    status: done

